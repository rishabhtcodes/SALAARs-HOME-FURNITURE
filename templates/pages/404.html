{% extends "base.html" %}

{% block title %}Page Not Found | {{ SITE.name }}{% endblock %}

{% block content %}
<section class="bg-cream py-20 sm:py-32">
  <div class="mx-auto max-w-xl px-4 text-center">
    <div class="rounded-3xl border border-line bg-white p-8 sm:p-14 shadow-soft">
      <p class="font-display text-6xl font-bold text-gold sm:text-7xl">404</p>
      <h1 class="mt-4 font-display text-2xl font-bold text-ink sm:text-3xl">Piece Not Found</h1>
      <p class="mt-3 text-sm text-stone">The page or furniture piece you are looking for has been moved or does not exist.</p>
      <div class="mt-8 flex flex-wrap justify-center gap-4">
        <a href="{% url 'home' %}" class="btn-gold">Back to Homepage</a>
        <a href="{% url 'shop' %}" class="btn-outline-dark">Browse All Pieces</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
